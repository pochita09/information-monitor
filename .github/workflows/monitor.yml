name: Update Monitor

on:
  schedule:
    # GitHub Actions cron is UTC: 07:13 / 13:17 / 21:23 JST.
    - cron: "13 22 * * *"
    - cron: "17 4 * * *"
    - cron: "23 12 * * *"
  workflow_dispatch:

# A run must finish state persistence before the next run starts.
concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  build:
    name: Fetch, score, and build Monitor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository and persisted state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Monitor dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUTF8: "1"
        run: python src/main.py

      - name: Commit changed state and generated Monitor
        run: |
          if git diff --quiet -- data/last_seen.json data/articles.json public; then
            echo "state_changed=false" >> "$GITHUB_ENV"
            echo "No state or public output changes; no commit created."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last_seen.json data/articles.json public
            git commit -m "chore: update monitor state"
            git push
            echo "state_changed=true" >> "$GITHUB_ENV"
            echo "Committed changed Monitor state."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy Monitor to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
